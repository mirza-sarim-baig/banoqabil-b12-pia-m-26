    <style>
      body {
        color: grey;

      .emotionContainer {
        width: 400px;
        height: 400px;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);

  <body>
    <h1>USERS PROFILE CARDS</h1>
    <!-- Button trigger modal -->
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      + Add User
    </button>

    <!-- Modal -->

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add New User
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="addUserForm">
              <!-- ID -->
              <div class="mb-3">
                <label for="userId" class="form-label">ID</label>
                <input
                  type="number"
                  class="form-control"
                  id="userId"
                  placeholder="e.g. 1"
                  required
                />
              </div>

              <!-- Name row -->
              <div class="row mb-3">
                <div class="col">
                  <label for="firstName" class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    placeholder="john"
                    required
                  />
                </div>
                <div class="col">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    placeholder="doe"
                    required
                  />
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="userEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="userEmail"
                  placeholder="john@gmail.com"
                  required
                />
              </div>

              <!-- Username -->
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="johnd"
                  required
                />
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="userPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="userPassword"
                  placeholder="••••••••"
                  required
                />
              </div>

              <!-- Profile Image URL -->
              <div class="mb-3">
                <label for="userImg" class="form-label"
                  >Profile Image URL</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="userImg"
                  placeholder="https://example.com/photo.jpg"
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="saveUserBtn">
              Save User
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      id="cardsContainer"
      class="d-flex flex-wrap justify-content-center gap-3"
    ></div>
