<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        color: grey;
      }
      .emotionContainer {
        width: 400px;
        height: 400px;
        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
      }
      .emotionContainer img {
        height: 200px;
        width: auto;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Link</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Dropdown
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Action</a></li>
                <li><a class="dropdown-item" href="#">Another action</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a class="dropdown-item" href="#">Something else here</a>
                </li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Disabled</a>
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
        </div>
      </div>
    </nav>
    <h1>Changing UI from js</h1>

    <div class="emotionContainer">
      <center>
        <h1>Emotion Changer</h1>

        <img
          src="https://png.pngtree.com/png-clipart/20230810/original/pngtree-happy-emoji-emoticon-showing-double-thumbs-up-like-picture-image_7851906.png"
          alt="emoji"
          id="emojiImg"
        />
        <h2 id="emotionTitle">Happy</h2>
        <button onclick="Happy()">Happy</button>
        <button onclick="Sad()">Sad</button>
        <button onclick="Angry()">Angry</button>
      </center>
    </div>

    <h1>USERS PROFILE CARDS</h1>
    <!-- Button trigger modal -->
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      + Add User
    </button>

    <!-- Modal -->

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Add New User
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="addUserForm">
              <!-- ID -->
              <div class="mb-3">
                <label for="userId" class="form-label">ID</label>
                <input
                  type="number"
                  class="form-control"
                  id="userId"
                  placeholder="e.g. 1"
                  required
                />
              </div>

              <!-- Name row -->
              <div class="row mb-3">
                <div class="col">
                  <label for="firstName" class="form-label">First Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="firstName"
                    placeholder="john"
                    required
                  />
                </div>
                <div class="col">
                  <label for="lastName" class="form-label">Last Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="lastName"
                    placeholder="doe"
                    required
                  />
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="userEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="userEmail"
                  placeholder="john@gmail.com"
                  required
                />
              </div>

              <!-- Username -->
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  placeholder="johnd"
                  required
                />
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label for="userPassword" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="userPassword"
                  placeholder="••••••••"
                  required
                />
              </div>

              <!-- Profile Image URL -->
              <div class="mb-3">
                <label for="userImg" class="form-label"
                  >Profile Image URL</label
                >
                <input
                  type="url"
                  class="form-control"
                  id="userImg"
                  placeholder="https://example.com/photo.jpg"
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="saveUserBtn">
              Save User
            </button>
          </div>
        </div>
      </div>
    </div>
    <div
      id="cardsContainer"
      class="d-flex flex-wrap justify-content-center gap-3"
    ></div>

    <br />
    <br />
    <br />
    <br />
    <br />
    <script>
      let emojiImg = document.getElementById("emojiImg");
      let emotionTitle = document.getElementById("emotionTitle");

      const Happy = () => {
        console.log("Happy");
        emojiImg.src =
          "https://png.pngtree.com/png-clipart/20230810/original/pngtree-happy-emoji-emoticon-showing-double-thumbs-up-like-picture-image_7851906.png";
        emotionTitle.innerText = "Happy";
      };
      const Sad = () => {
        console.log("Sad");
        emojiImg.src =
          "https://www.clipartmax.com/png/middle/64-644516_very-sad-emoji-sad-emoji.png";
        emotionTitle.innerText = "Sad";
      };
      const Angry = () => {
        console.log("Angry");
        emojiImg.src =
          "https://png.pngtree.com/png-clipart/20250518/original/pngtree-an-intense-angry-face-emoji-with-a-fiery-red-glow-png-image_21019845.png";
        emotionTitle.innerText = "Angry";
      };

      let usersData = [
        {
          id: 1,
          email: "john@gmail.com",
          img: "https://st4.depositphotos.com/1591576/20941/i/450/depositphotos_209419856-stock-photo-moody-portrait-young-stylish-bearded.jpg",
          username: "johnd",
          password: "m38rmF$",
          name: {
            firstname: "john",
            lastname: "doe",
          },
        },
        {
          id: 2,
          img: "https://plus.unsplash.com/premium_photo-1689977927774-401b12d137d6?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8bWFufGVufDB8fDB8fHww",
          email: "helo@gmail.com",
          username: "helod",
          password: "m38rmF$",
          name: {
            firstname: "helo",
            lastname: "doe",
          },
        },
        {
          id: 3,
          email: "hola@gmail.com",
          img: "https://img.magnific.com/free-photo/young-bearded-man-with-denim-shirt_273609-7230.jpg?semt=ais_hybrid&w=740&q=80",
          username: "hola",
          password: "m38rmF$",
          name: {
            firstname: "hola",
            lastname: "doe",
          },
        },
      ];

      let cardsContainer = document.getElementById("cardsContainer");

      for (let i = 0; i < usersData.length; i++) {
        console.log(usersData[i]);
        cardsContainer.innerHTML += `<div class="card bg-body-tertiary" style="width: 18rem">
      <img
        src=${usersData[i].img}
        alt="emoji"
        id="emojiImg"
      />
      <div class="card-body">
        <h5 class="card-title text-danger">${usersData[i].name.firstname}</h5>
        <p class="card-text text-success">
          Some quick example text to build on the card title and make up the
          bulk of the card’s content.
        </p>
        <a href="#" class="btn btn-outline-primary">${usersData[i].username}</a>
      </div>
    </div>`;
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
