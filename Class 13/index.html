<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — Aurore</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background Scene -->
    <div class="bg-scene">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grid-overlay"></div>

      <div class="particles">
        <div class="particle circle p1"></div>
        <div class="particle square p2"></div>
        <div class="particle ring p3"></div>
        <div class="particle circle p4"></div>
        <div class="particle square p5"></div>
        <div class="particle ring p6"></div>
        <div class="particle circle p7"></div>
        <div class="particle square p8"></div>
        <div class="particle ring p9"></div>
        <div class="particle circle p10"></div>
        <div class="particle square p11"></div>
        <div class="particle ring p12"></div>
        <div class="particle circle p13"></div>
        <div class="particle square p14"></div>
        <div class="particle ring p15"></div>
        <div class="particle ring p16"></div>
        <div class="particle ring p17"></div>
        <div class="particle circle p18"></div>
      </div>
    </div>

    <!-- Page -->
    <div class="page-wrapper">
      <div class="card">
        <!-- Brand -->
        <div class="brand">
          <div class="brand-icon">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"
              />
            </svg>
          </div>
          <span class="brand-name">Aurore</span>
        </div>

        <!-- Heading -->
        <h1 class="card-title">Welcome <em>back</em></h1>
        <p class="card-subtitle">Sign in to continue your journey.</p>

        <!-- Form -->
        <form action="#" method="post" novalidate>
          <div class="form-group">
            <label for="email">Email address</label>
            <div class="input-wrap">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="2" y="4" width="20" height="16" rx="3" />
                <path d="M2 7l10 7 10-7" />
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrap">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" />
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Your password"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-pw"
                aria-label="Toggle password"
                onclick="togglePw('password', this)"
              >
                <svg
                  id="eye-login"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  width="17"
                  height="17"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-extras">
            <label class="remember-me">
              <input type="checkbox" name="remember" id="remember" />
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="divider"><span>or continue with</span></div>

        <div class="social-row">
          <a href="#" class="btn-social">
            <!-- Google -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Google
          </a>
          <a href="#" class="btn-social">
            <!-- Apple -->
            <svg viewBox="0 0 24 24" fill="currentColor" width="17" height="17">
              <path
                d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.39-1.32 2.76-2.53 3.99zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"
              />
            </svg>
            Apple
          </a>
        </div>

        <p class="card-footer">
          Don't have an account? <a href="signup.html">Create one</a>
        </p>
      </div>
    </div>

    <script>
      function togglePw(id, btn) {
        const input = document.getElementById(id);
        const isText = input.type === "text";
        input.type = isText ? "password" : "text";
        btn.querySelector("svg").innerHTML = isText
          ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
          : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      }
    </script>
    <script src="app.js"></script>
  </body>
</html>
